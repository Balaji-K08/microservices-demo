name: build-deploy_pipeline
on: 
  push:
    branches: [main]
  pull_request:
    branches:
      - main
  workflow_dispatch:
  
jobs:
  services_list: # jop to find the list of services to deploy
    runs-on: ubuntu-slim

    outputs:
      services: ${{ steps.changed-services.outputs.services }}
      has_changes: ${{ steps.changed-services.outputs.has_changes }}
    
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find changed services
        id: changed-services
        shell: bash
        run: |
          services=$(
            git diff --name-only HEAD^ HEAD |
            awk -F/ '$1 == "src" && $2 != "" {print $2}' |
            sort -u |
            jq -R -s -c 'split("\n") | map(select(length > 0))'
          )

          echo "Changed services: $services"

          echo "services=$services" >> "$GITHUB_OUTPUT"
          
          if [ "$services" = "[]" ]; then
            has_changes=false
          else
            has_changes=true
          fi

          echo "has_changes=$has_changes" >> "$GITHUB_OUTPUT"

          echo "flag: $has_changes"

  # build:
  #   runs-on: ubuntu-latest
  #   needs: services_list
  #   strategy:
  #     matrix:
  #       service: ${{ fromJSON(needs.services_list.outputs.services) }}

  #   steps:
  #     - name: Checkout
  #       uses: actions/checkout@v4

  #     - name: Build Docker image
  #       run: |
  #         docker build \
  #           -t mydockerhubuser/${{ matrix.service }}:latest \
  #           ./src/${{ matrix.service }}





  build-and-push:
    name: Build and push ${{ matrix.service }}

    environment: test-env

    needs: services_list
    if: needs.services_list.outputs.has_changes == 'true'

    strategy:
      matrix:
        service: ${{ fromJSON(needs.services_list.outputs.services) }}

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY }}
          tags: |
            type=raw,value=${{ matrix.service }}-${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # - name: Build and push Docker image
      #   uses: docker/build-push-action@v7
      #   with:
      #     context: ./src/${{ matrix.service }}
      #     push: true
      #     tags: ${{ steps.meta.outputs.tags }}
      #     labels: ${{ steps.meta.outputs.labels }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          # If cartservice, adds /service to the path; otherwise keeps the standard path
          context: >-
            ${{ matrix.service == 'cartservice' 
            && format('./src/{0}/src', matrix.service) 
            || format('./src/{0}', matrix.service) }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          

  update-config-repo:
    name: Notify config repository
    environment: test-env
    needs:
      - services_list
      - build-and-push
    if: ${{ needs.services_list.outputs.services != '[]' }}
    runs-on: ubuntu-latest

    steps:
      - name: Send image update event
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.CONFIG_REPO_TOKEN }}
          repository: ${{ vars.CONFIG_REPO_NAME }} # CONFIG_REPO_NAME = USERNAME/REPONAME
          event-type: images-built
          client-payload: |
            {
              "services": ${{ needs.services_list.outputs.services }},
              "sha": "${{ github.sha }}"
            }